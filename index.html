
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Busca Emprega Soluções</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #222;
    }
    header {
      background: #12345a;
      color: white;
      text-align: center;
      padding: 28px 15px;
    }
    main {
      padding: 20px;
      max-width: 500px;
      margin: auto;
    }
    .card {
      background: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0001;
    }
    button {
      background: #167447;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      width: 100%;
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<header>
  <h1>Busca Emprega</h1>
  <p>Soluções para quem procura e oferece emprego</p>
</header>

<main>
  <div class="card">
    <h2>Estou procurando emprego</h2>
    <p>Encontre oportunidades na sua região.</p>
    <button>Buscar emprego</button>
  </div>

  <div class="card">
    <h2>Sou empresa</h2>
    <p>Encontre profissionais para sua empresa.</p>
    <button>Oferecer emprego</button>
  </div>

  <div class="card">
    <h2>Currículos</h2>
    <p>Cadastre seu currículo e encontre oportunidades.</p>
    <button>Cadastrar currículo</button>
  </div>
</main>

</body>
</html>
