
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Busca Emprega Soluções</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #222;
    }

    header {
      background: #12345a;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    main {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 22px;
      margin-bottom: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0002;
    }

    button {
      background: #167447;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      width: 100%;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <header>
    <h1>BUSCA EMPREGA</h1>
    <p>Soluções para quem procura e oferece emprego</p>
  </header>

  <main>

    <div class="card">
      <h2>Estou procurando emprego</h2>
      <p>Encontre oportunidades de trabalho na sua região.</p>
      <button>Buscar emprego</button>
    </div>

    <div class="card">
      <h2>Sou empresa</h2>
      <p>Encontre profissionais para sua empresa.</p>
      <button>Oferecer emprego</button>
    </div>

    <div class="card">
      <h2>Currículos</h2>
      <p>Cadastre seu currículo e encontre oportunidades.</p>
      <button>Cadastrar currículo</button>
    </div>

  </main>

</body>
</html>
